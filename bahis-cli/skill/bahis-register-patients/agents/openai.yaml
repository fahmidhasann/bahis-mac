interface:
  display_name: "BAHIS Register Patients"
  short_description: "Register verified fictional BAHIS patients"
  default_prompt: "Use $bahis-register-patients to register 20 patients."

dependencies:
  tools:
    - type: "shell"
      # The command, not a path. npm installs `bahis` onto PATH on every platform, so this
      # entry stays correct when the repo moves or is cloned somewhere else.
      value: "bahis"
      description: "BAHIS Patient Registry CLI"

policy:
  allow_implicit_invocation: false
